name: Deploy Project
on: [push, workflow_dispatch]
jobs:
 test:
  runs-on: ubuntu-latest
  steps: 
   - name: Get code
     uses: actions/checkout@v7
   - name: Setup NodeJS
     uses: actions/setup-node@v5
     with: 
      node-version: 22
   - name: Install Dependencies
     run: npm ci
   - name: Run Tests
     run: npm test 
 deploy:
  needs: test
  runs-on: ubuntu-latest
  steps: 
   - name: Get code
     uses: actions/checkout@v7
   - name: Setup NodeJS
     uses: actions/setup-node@v5
     with: 
      node-version: 22
   - name: Install Dependencies
     run: npm ci
   - name: Build Project
     run: npm run build
   - name: Deploy
     run: echo "Deploying ...." 