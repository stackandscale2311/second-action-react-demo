name: Test Project
on: push
jobs:
 test:
  runs-on: ubuntu-latest
  steps: 
   - name: Get code
     uses: actions/checkout@v7
   - name: Setup NodeJS
     uses: actions/setup-node@v4
     with: 
      node-version: 26
   - name: Install Dependencies
     run: npm ci
   - name: Run Tests
     run: npm test 